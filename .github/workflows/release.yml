name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source zip
        shell: bash
        run: |
          set -e
          PKG="reelax-script-dev-${GITHUB_REF_NAME}"
          mkdir -p "$PKG"
          # 用 git archive 导出版本控制文件（自动排除 .git / 未跟踪的敏感与临时文件），避免把正在写入的 PKG 递归进去
          git archive --format=tar HEAD | tar -x -C "$PKG"
          zip -r "reelax-script-dev-${GITHUB_REF_NAME}.zip" "$PKG"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            reelax-script-dev-*.zip
          generate_release_notes: true